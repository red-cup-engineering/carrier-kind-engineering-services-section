name = "paid-value-chain-gateway"
main = "src/worker.mjs"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Every settlement-affecting value (network, payee, facilitator) is supplied
# here or by `wrangler secret put`, never hardcoded in src/. Price is not one
# of them: it belongs to the offer declaration in src/offers.mjs. See
# envConfiguration() in src/worker.mjs and the "Configuration" section of
# README.md. No custom domain (routes) is set: this deploys to the
# workers.dev subdomain only.

[vars]
X402_NETWORK = "eip155:8453"
# PayAI's free, keyless x402 facilitator; live-verified for the "exact"
# scheme on Base mainnet by base-chain-data-gateway (2026-08-31) -- no CDP
# account or API key required.
X402_FACILITATOR = "https://facilitator.payai.network"
# X402_PAY_TO is a `wrangler secret put` value, not a var; the payout
# address it carries is the same Base USDC address the other x402 sellers
# use (x402-services-section data/logs/2026/09/01 payto-decision record;
# resolved through key-management-services-section's
# scripts/resolve-payment-receiver.mjs at deploy time, never typed here).
