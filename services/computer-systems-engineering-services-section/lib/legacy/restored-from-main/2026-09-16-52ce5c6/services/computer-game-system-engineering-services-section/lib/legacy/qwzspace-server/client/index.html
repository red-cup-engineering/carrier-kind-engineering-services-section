<!doctype html>
<meta charset="utf-8" />
<title>QwzSpace — client contract stub</title>
<!--
  This is the visual/UX agent's handoff point, not a finished client.

  The engine emits one `SceneEntry` per body over the web-qwzspace transport
  (SSE at /qwz/events, or WebSocket). A renderer reads each entry at its tier:

    webgl    — entry.x, entry.y, entry.z, entry.yaw, entry.charge
    canvas2d — entry.x, entry.z (the ground plane), entry.charge
    text     — entry.kind, entry.charge, entry.site, entry.depth

  `entry.charge` is the bilattice glyph of world-truth: t real, ⊤ undead
  (alive AND slain — render it!), f destroyed, ⊥ unknown. Send intents (move,
  strike, spawn, …) as JSON to /qwz/act. See `../dist/protocol.d.ts`.

  Below is the universal text-tier floor: connect, dump entries. Replace with a
  real WebGL2 renderer (port aletheon's gl/ engine) for the rich tier.
-->
<pre id="log">connecting…</pre>
<script type="module">
  const log = document.getElementById("log");
  const line = (s) => { log.textContent += "\n" + s; };
  const es = new EventSource("/qwz/events");
  es.onopen = () => { log.textContent = "connected to /qwz/events"; };
  es.onmessage = (ev) => {
    try {
      const frame = JSON.parse(ev.data);
      const entities = frame.entities || frame.e || [];
      for (const e of entities) line(`${e.charge ?? "?"} ${e.kind ?? "?"} ${e.id} @ site [${(e.site ?? []).join(",")}]`);
    } catch { line(ev.data); }
  };
  es.onerror = () => line("(stream error)");
</script>
