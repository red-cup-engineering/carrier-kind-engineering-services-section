# Per-machine policy for the managed git wrapper (scripts/git-services).
# Copy and edit this file for each machine on the network; scripts/git-services itself
# carries no machine-specific values. Shell syntax; sourced by scripts/git-services.

# The one directory tree this machine allows git to operate in.
repo_root=/home/emsenn/info

# The colony actor this machine's git activity is attributed to.
colony_actor=urn:ame:bare-cedar-fog-colony

# Home directory whose gh login supplies GitHub credentials (via
# `gh auth git-credential` named in managed.gitconfig).
home_dir=/home/emsenn

# All git writes on this machine serialize through this one lock file.
# Keep it on tmpfs, outside every repository.
lock_file=/tmp/managed-git-emsenn.lock
lock_wait_seconds=300

# An index.lock with no live holder older than this is treated as orphaned.
stale_index_lock_seconds=300

# Identity, editor, credential helper, and other git defaults live in a
# per-machine gitconfig, not in code.
managed_gitconfig_name=managed.gitconfig

# Subcommands that never take the write lock.
read_commands="status diff log show rev-parse symbolic-ref ls-files ls-tree ls-remote cat-file merge-base diff-tree diff-index name-rev describe shortlog blame grep reflog"

# Subcommands admitted through the serialized write lane.
write_commands="add commit restore rm mv checkout switch reset merge cherry-pick revert tag stash filter-repo clean fetch pull push submodule worktree branch remote config gc"

# Guards for the two failure modes this wrapper exists to stop on a machine
# where many agents share one tree: sweeping another agent's staged work
# into your commit, and staging everything ambiently.
forbid_ambient_add=true
require_scoped_commit=true
