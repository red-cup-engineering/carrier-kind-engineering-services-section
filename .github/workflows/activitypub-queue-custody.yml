name: ActivityPub queue custody
on:
  push:
    branches: [main]
    paths:
      - 'services/computer-networking-engineering-services-section/services/activitypub-services-section/**'
      - '.github/workflows/activitypub-queue-custody.yml'
  pull_request:
    paths:
      - 'services/computer-networking-engineering-services-section/services/activitypub-services-section/**'
      - '.github/workflows/activitypub-queue-custody.yml'
permissions:
  contents: read
jobs:
  custody:
    uses: red-cup-engineering/continuous-delivery-services-section/.github/workflows/node-package.yml@0cb82dd6dabe5af4a5e416512cc134f5161d3438
    with:
      paths: '["services/computer-networking-engineering-services-section/services/activitypub-services-section"]'
      install: false
      check: false
      test-script: 'test:queue-custody'
