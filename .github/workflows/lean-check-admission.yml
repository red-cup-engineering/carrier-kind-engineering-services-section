name: Lean check admission

on:
  push:
    branches: ['**']
    paths:
      - 'services/computer-systems-engineering-services-section/services/computer-proofing-system-services-section/services/lean-system-services-section/src/check/**'
      - 'services/computer-systems-engineering-services-section/services/computer-proofing-system-services-section/services/lean-system-services-section/test/lean-check-admission.test.mjs'
      - '.github/workflows/lean-check-admission.yml'
  pull_request:
    paths:
      - 'services/computer-systems-engineering-services-section/services/computer-proofing-system-services-section/services/lean-system-services-section/src/check/**'
      - 'services/computer-systems-engineering-services-section/services/computer-proofing-system-services-section/services/lean-system-services-section/test/lean-check-admission.test.mjs'
      - '.github/workflows/lean-check-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify checker sources and input discipline
        working-directory: services/computer-systems-engineering-services-section/services/computer-proofing-system-services-section/services/lean-system-services-section
        run: |
          node --check src/check/plan.mjs
          node --check src/check/admission.mjs
          node --check src/check/run.mjs
          node --test test/lean-check-admission.test.mjs
      # Live systemd-run / Lake source-stability receiving remains a separate
      # integration test on the actual Lean worker with its installed toolchain.
