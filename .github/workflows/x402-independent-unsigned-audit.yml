name: Independent public x402 unsigned audit
on:
  push:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/scripts/audit-unsigned-merchant.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/unsigned-merchant-audit.test.mjs'
      - '.github/workflows/x402-independent-unsigned-audit.yml'
  pull_request:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/scripts/audit-unsigned-merchant.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/unsigned-merchant-audit.test.mjs'
      - '.github/workflows/x402-independent-unsigned-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-auditor-assay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove challenge and network-failure classification
        run: |
          node --check services/computer-networking-engineering-services-section/services/x402-services-section/scripts/audit-unsigned-merchant.mjs
          node --test services/computer-networking-engineering-services-section/services/x402-services-section/test/market/unsigned-merchant-audit.test.mjs
  external-unsigned-market-receiving:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently probe all listed public offers without money or signer
        run: |
          node services/computer-networking-engineering-services-section/services/x402-services-section/scripts/audit-unsigned-merchant.mjs "$RUNNER_TEMP/market-unsigned-audit.json"
      - name: Preserve minimal non-secret classification artifact even on outage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x402-external-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/market-unsigned-audit.json
          if-no-files-found: warn
          retention-days: 7
