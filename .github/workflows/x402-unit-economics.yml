name: x402 catalog economics conformance
on:
  pull_request:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/src/market/unit-economics.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/unit-economics.test.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/apps/market-561-group/scripts/audit-unit-economics.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/package.json'
      - '.github/workflows/x402-unit-economics.yml'
  push:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/src/market/unit-economics.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/unit-economics.test.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/apps/market-561-group/scripts/audit-unit-economics.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/package.json'
      - '.github/workflows/x402-unit-economics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-economics-assay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check services/computer-networking-engineering-services-section/services/x402-services-section/src/market/unit-economics.mjs
      - run: node --check services/computer-networking-engineering-services-section/services/x402-services-section/apps/market-561-group/scripts/audit-unit-economics.mjs
      - run: node --test services/computer-networking-engineering-services-section/services/x402-services-section/test/market/unit-economics.test.mjs
