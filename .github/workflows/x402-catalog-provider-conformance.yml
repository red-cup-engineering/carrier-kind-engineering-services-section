name: x402 merchant provider-binding conformance
on:
  push:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/data/market-561-group/records/catalog.json'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/package.json'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/.npmignore'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/src/offer.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/schemas/**'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/apps/market-561-group/src/edge-bindings.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/catalog-source-conformance.test.mjs'
      - '.github/workflows/x402-catalog-provider-conformance.yml'
  pull_request:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/data/market-561-group/records/catalog.json'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/package.json'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/.npmignore'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/src/offer.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/schemas/**'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/apps/market-561-group/src/edge-bindings.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/catalog-source-conformance.test.mjs'
      - '.github/workflows/x402-catalog-provider-conformance.yml'
permissions:
  contents: read
jobs:
  source-and-compiled-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merchant source and generated edge import invariants
        run: node --test services/computer-networking-engineering-services-section/services/x402-services-section/test/market/catalog-source-conformance.test.mjs

