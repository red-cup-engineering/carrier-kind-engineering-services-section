name: Astronomy package distributability
on:
  pull_request:
    paths:
      - 'services/computer-systems-engineering-services-section'
      - 'services/computer-systems-engineering-services-section/services/computer-simulation-system-services-section/services/astronomy-position-computation-service/**'
      - '.github/workflows/astronomy-package.yml'
  push:
    paths:
      - 'services/computer-systems-engineering-services-section'
      - 'services/computer-systems-engineering-services-section/services/computer-simulation-system-services-section/services/astronomy-position-computation-service/**'
      - '.github/workflows/astronomy-package.yml'
permissions:
  contents: read
jobs:
  pure-astronomy-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/computer-systems-engineering-services-section/services/computer-simulation-system-services-section/services/astronomy-position-computation-service
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static module and source checks
        run: npm run check
      - name: Numeric and packaging regression tests
        run: npm test
      - name: Pack and exercise in an independent consumer
        run: |
          TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)
          test -s "$RUNNER_TEMP/$TARBALL"
          mkdir -p "$RUNNER_TEMP/astronomy-consumer"
          cd "$RUNNER_TEMP/astronomy-consumer"
          npm install --no-audit --no-fund --ignore-scripts "$RUNNER_TEMP/$TARBALL"
          node --input-type=module -e '
            import { computeAstronomyPositions, BODIES, findLunationQuarters } from "@lenticule-science/astronomy-position-computation-service";
            import { computePrecisionAstronomyPositions } from "@lenticule-science/astronomy-position-computation-service/node";
            const result = computeAstronomyPositions("2026-09-08T00:00:00Z");
            if (BODIES.length !== 10 || result.bodies.sun.longitude !== 165.377 || typeof findLunationQuarters !== "function") throw new Error("astronomy package changed its public numerical contract");
            if (typeof computePrecisionAstronomyPositions !== "function") throw new Error("precision adapter is not exported");
          '
