name: x402 compiled declaration identity
on:
  push:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/data/market-561-group/records/catalog.json'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/apps/market-561-group/src/compiled-offers.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/compiled-identity.test.mjs'
      - '.github/workflows/x402-compiled-identity.yml'
  pull_request:
    paths:
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/data/market-561-group/records/catalog.json'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/apps/market-561-group/src/compiled-offers.mjs'
      - 'services/computer-networking-engineering-services-section/services/x402-services-section/test/market/compiled-identity.test.mjs'
      - '.github/workflows/x402-compiled-identity.yml'
permissions:
  contents: read
jobs:
  compiled-declarations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/computer-networking-engineering-services-section/services/x402-services-section/test/market/compiled-identity.test.mjs
