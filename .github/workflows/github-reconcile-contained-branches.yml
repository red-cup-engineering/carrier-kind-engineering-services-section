# Original Computer Engineering consumer of the one GitHub reconciliation service.
# Source classification / byte equivalence are NOT independently accepted Work.
# This workflow observes original branches/PRs/archive tags read-only and
# surfaces the receiving frontier. The native GitHub Engineering receiver owns
# separately authorized, exact-revision source integration / ref retirement.
name: Observe branches for original source receiving
on:
  push:
    branches: [main]
    paths:
      - 'services/computer-systems-engineering-services-section'
      - 'services/computer-systems-engineering-services-section/services/computer-code-development-system-services-section/services/github-reconciliation-service/**'
      - '.github/workflows/github-reconcile-contained-branches.yml'
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-contained-${{ github.repository }}
  cancel-in-progress: false
jobs:
  contained:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Qualify the source-owned reconciliation contract
        run: node --test 'services/computer-systems-engineering-services-section/services/computer-code-development-system-services-section/services/github-reconciliation-service/test/'*.test.mjs
      - name: Observe original branch and issue sources without effects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Historical byte-equivalence is a SOURCE-ONLY question. No --apply,
          # --merge-green-pulls or --close-issues and no write-capable token.
          # The old --register wrote ephemeral debt JSON that no consumer read;
          # retain the one original machine-readable stdout/report instead.
          node 'services/computer-systems-engineering-services-section/services/computer-code-development-system-services-section/services/github-reconciliation-service/bin/github-reconcile.mjs' \
            --repo "$GITHUB_REPOSITORY" --max-merges 0 \
            --receive-equivalent --max-equivalents 3 \
            | tee "$RUNNER_TEMP/github-reconciliation-result.json"
          # Log a usable, bounded receipt; do not publish token or source.
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const msg=[
              "# Original GitHub source-receiving frontier (read-only)",
              "Repository: "+process.env.GITHUB_REPOSITORY,
              "Archive-tagged source objects awaiting receiving: "+(r.archiveTagSourcesAwaitingReceiving??0),
              "Source-contained branch assessments: "+(r.branchesDeletable??0),
              "Source-equivalent history assessments: "+(r.equivalentCandidates??0),
              "Unreceived source/debt records observed: "+r.debtRecords,
              "Read-only provider errors: "+(r.errors?.length??0),
              "Original Work/ordinary consumer receiving: NOT ESTABLISHED",
              "Automatic source-ref retirement authority: NONE",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,msg.join("\n")+"\n");
            if(r.errors?.length)process.exitCode=1;
          ' "$RUNNER_TEMP/github-reconciliation-result.json"
