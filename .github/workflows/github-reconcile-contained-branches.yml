# Original Computer Engineering consumer of the one GitHub reconciliation service.
# Source classification / byte equivalence are NOT independently accepted Work.
# This workflow observes original branches/PRs/archive tags read-only and
# surfaces the receiving frontier. The native GitHub Engineering receiver owns
# separately authorized, exact-revision source integration / ref retirement.
name: Observe branches for original source receiving
on:
  push:
    branches: [main]
    paths:
      - 'services/computer-systems-engineering-services-section'
      - 'services/computer-systems-engineering-services-section/services/computer-code-development-system-services-section/services/github-reconciliation-service/**'
      - '.github/workflows/github-reconcile-contained-branches.yml'
      - '.github/scripts/github-source-receiving-summary.mjs'
      - 'test/github-source-receiving-summary.test.mjs'
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-contained-${{ github.repository }}
  cancel-in-progress: false
jobs:
  contained:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Qualify the source-owned reconciliation contract
        run: |
          node --test 'services/computer-systems-engineering-services-section/services/computer-code-development-system-services-section/services/github-reconciliation-service/test/'*.test.mjs
          node --test test/github-source-receiving-summary.test.mjs
      - name: Observe original branch and issue sources without effects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The one source-owned CLI remains read-only and source-typed.
          # Keep the original JSON on this job only, with a real receiving reader.
          node 'services/computer-systems-engineering-services-section/services/computer-code-development-system-services-section/services/github-reconciliation-service/bin/github-reconcile.mjs' \
            --repo "$GITHUB_REPOSITORY" \
            --receive-equivalent --max-equivalents 3 \
            | tee "$RUNNER_TEMP/github-reconciliation-result.json"
          # A missing/incompatible producer contract, partial census, or any
          # claimed effect fails this consumer rather than printing false zeros.
          node .github/scripts/github-source-receiving-summary.mjs \
            "$RUNNER_TEMP/github-reconciliation-result.json" >> "$GITHUB_STEP_SUMMARY"
