name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: if [ -f package.json ]; then npm install --no-audit --no-fund; fi
        continue-on-error: true
      - name: Test
        run: npm test
        continue-on-error: true
