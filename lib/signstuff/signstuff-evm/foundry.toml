[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Shanghai: PUSH0 yes, MCOPY/transient storage no, so the same bytecode lands on
# Base, Arbitrum, Optimism and Gnosis without a per-chain hardfork audit.
evm_version = "shanghai"
fs_permissions = [{ access = "read", path = "test/vectors" }]

[fuzz]
runs = 512

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[lint]
lint_on_build = false
